# SPDX-License-Identifier: GPL-3.0-or-later
# Al mergear a main (que solo acepta ramas release/X.Y.Z): si la versión de Cargo.toml todavía
# no tiene tag, la publica. Crea el tag, sube el paquete fuente a OBS (Debian, Ubuntu, Fedora,
# openSUSE) y actualiza el AUR. Si quedó una rama next que no incluye la versión publicada, avisa.
# Necesita: variable OBS_USER y secretos OBS_PASSWORD y AUR_SSH_KEY (Ajustes → Actions),
# y las imágenes trigonum-ci/debian y trigonum-ci/arch en el runner (build-aux/ci/build-images.sh).
name: Release

on:
  push:
    branches: [main]

jobs:
  check:
    name: ¿Hay versión nueva?
    runs-on: docker
    container:
      image: node:22-bookworm
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Versiones coherentes
        run: build-aux/ci/check-version.sh
      - id: v
        name: Buscar el tag
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$v ya existe: no se publica nada."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Se publica la v$v."
          fi

  tag:
    name: Tag v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Crear y subir el tag
        run: |
          v=${{ needs.check.outputs.version }}
          git -c user.name=nachopro -c user.email=tech@local.net.ar tag -a "v$v" -m "Trigonum $v"
          git push origin "v$v"

  obs:
    name: OBS
    needs: [check, tag]
    runs-on: docker
    container:
      image: trigonum-ci/debian:latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Subir el paquete fuente a OBS
        env:
          OBS_USER: ${{ vars.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: build-aux/ci/release-obs.sh

  aur:
    name: AUR
    needs: [check, tag]
    runs-on: docker
    container:
      image: trigonum-ci/arch:latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Actualizar el AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: build-aux/ci/release-aur.sh

  next-al-dia:
    name: ¿Quedó una next vieja?
    needs: [check, tag]
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revisar next
        run: |
          git config --global --add safe.directory "$PWD"
          v=${{ needs.check.outputs.version }}
          git fetch -q origin --tags
          if ! git rev-parse -q --verify origin/next >/dev/null; then
            echo "No hay rama next: el próximo ciclo arranca con git switch -c next origin/main."
          elif git merge-base --is-ancestor "v$v" origin/next; then
            echo "next ya incluye v$v."
          else
            echo "::warning::Existe una rama next que no incluye v$v. Si es de un ciclo nuevo, traele main (git merge origin/main); si quedó vieja, borrala y creala de nuevo desde main."
          fi
