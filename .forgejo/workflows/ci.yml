# SPDX-License-Identifier: GPL-3.0-or-later
# Cada PR: compila, testea e instala el paquete real en todas las distros soportadas.
# Usa las imágenes trigonum-ci/* del runner (build-aux/ci/build-images.sh), que ya traen
# las herramientas y dependencias. Lo mismo se corre localmente con build-aux/ci/run-local.sh.
name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_HOME: /root/.cargo

jobs:
  arch:
    name: arch + clippy
    runs-on: docker
    container:
      image: trigonum-ci/arch:latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /root/.cargo/registry/index
            /root/.cargo/registry/cache
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: target
          key: clippy-target-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: clippy-target-${{ hashFiles('Cargo.lock') }}-
      - name: Versiones coherentes
        run: build-aux/ci/check-version.sh
      - name: clippy (avisa si se usa algo más nuevo que Rust 1.85)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Compilar, testear e instalar el paquete
        run: build-aux/ci/build-arch.sh

  build:
    name: ${{ matrix.distro }}
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian, script: build-deb.sh }
          - { distro: ubuntu, script: build-deb.sh }
          - { distro: fedora, script: build-rpm.sh }
          - { distro: opensuse, script: build-rpm.sh }
    container:
      image: trigonum-ci/${{ matrix.distro }}:latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /root/.cargo/registry/index
            /root/.cargo/registry/cache
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Compilar, testear e instalar el paquete
        run: build-aux/ci/${{ matrix.script }}
